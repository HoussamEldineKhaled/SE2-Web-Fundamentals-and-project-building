<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Houssam's GitHub User Explorer</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <div class="title-section"><h1>User Explorer</h1></div>
    <form action="" method="get" class="form-section">
        <label for="search-input"><h2>Enter the account you want to look at</h2></label>
        <input type="text" name="search-input" class="search-input" id="search-input">
        <button type="submit" class="search-button" id="search-button">Search</button>
    </form>
    <div id="user-profile-display" class="display-section"></div>
    
    <div class="search-results">
        <div id="user-profile-display" class="user-profile-display"></div>
        <div id="repo-list" class="repo-list"></div>
    </div>
    


</body>
</html>
