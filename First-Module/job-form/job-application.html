<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStart Careers: Job Application</title>
</head>
<body>

    <form action="/submit-application" method="get">
        <fieldset>
            <legend>Personal Information</legend>
            <label for="first-name">First Name: </label>
            <input type="text" name="first-name" placeholder="First Name" required>
            <br>
            <label for="last-name">Last Name: </label>
            <input type="text" name="last-name" placeholder="Last Name" required>
            <br>
            <label for="date-of-birth">Date of Birth: </label>
            <input type="date" name="date-of-birth" placeholder="Date of Birth">
            <br>
            <label>Gender</label>
            <br>
            <label for="male">Male</label>
            <input type="radio" name="male" value="Male">
            <label for="female">Female</label>
            <input type="radio" name="female" value="Female">
            <label for="non-binary">Non-binary</label>
            <input type="radio" name="non-binary" value="Non-binary">
            <label for="idk">Prefer not to say</label>
            <input type="radio" name="idk" value="Prefer not to say">
        </fieldset>

        <fieldset>
            <legend>Contact Details</legend>
            <label for="email">Email</label>
            <input type="email" name="email" placeholder="Enter Email" required>
            <br>
            <label for="number">Phone Number</label>
            <input type="tel" name="number" placeholder="Enter Phone Number">
            <br>
            <label for="street">Street Address</label>
            <input type="text" name="street" placeholder="Enter Street Address">
            <br>
            <label for="city">City</label>
            <input type="text" name="city" placeholder="Enter City">
            <br>
            <label for="State">State/Province</label>
            <select name="State">
                <option value="">-- Select Province --</option>
                <option value="beirut">Beirut</option>
                <option value="jnoub">Jnoub</option>
                <option value="shamel">Shamel</option>
                <option value="akkar">Akkar</option>
                <option value="bekaa">Bekaa</option>
                <option value="jabal">Jabal</option>
                <option value="nabatieh">Nabatieh</option>
                <option value="baalbek-hermel">Baalbek-Hermel</option>
                <option value="kesserwen-jbeil">Kesserwen-Jbeil</option>
            </select>
            <br>
            <label for="ZIP">ZIP/Postal Code</label>
            <input type="text" name="ZIP" placeholder="Enter Zip/Postal Code">
            <br>
            <label for="country">Country</label>
            <select name="country">
                <option value="lebanon">Lebanon</option>
                <option value="finland">Finland</option>
                <option value="canada">Canada</option>
                <option value="egypt">Egypt</option>
                <option value="libya">Libya</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>Position & Experience</legend>

            <label for="position">Select Position you are applying for</label>
            <select name="position">
                <option value="software developer">Software Developer</option>
                <option value="web developer">Web Developer</option>
                <option value="data analyst">Data Analyst</option>
                <option value="UX/UI designer">UX/UI Designer</option>
                <option value="project manager">Project Manager</option>
                <option value="marketing specialist">Marketing Specialist</option>
                <option value="other">Other</option>
            </select>
            <br>
            <label>Department Preference</label>
            <br>
            <label for="engineering">Engineering</label>
            <input type="radio" name="engineering" value="engineering">
            <label for="design">Design</label>
            <input type="radio" name="design" value="design">
            <label for="marketing">Marketing</label>
            <input type="radio" name="marketing" value="marketing">
            <label for="sales">Sales</label>
            <input type="radio" name="sales" value="sales">
            <label for="operations">Operations</label>
            <input type="radio" name="operations" value="operations">
            <br>
            <br>
            <label>Experience Level</label>
            <br>
            <label for="entry">Entry Level</label>
            <input type="radio" name="entry" value="entry">
            <label for="mid">Mid Level</label>
            <input type="radio" name="mid" value="mid">
            <label for="senior">Senior Level</label>
            <input type="radio" name="senior" value="senior">
            <label for="lead">Lead/Manager</label>
            <input type="radio" name="lead" value="lead">
            <br>
            <br>
            <label for="employment-status">Employment Status</label>
            <select name="employment-status">
                <option value="">-- Select Status --</option>
                <option value="employed">Employed</option>
                <option value="unemployed">Unemployed</option>
                <option value="student">Student</option>
                <option value="freelancer">Freelancer</option>
                <option value="other">Other</option>
            </select>
        </fieldset>
    </form>
    
</body>
</html>
